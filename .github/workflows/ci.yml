name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'npm'

            - run: npm ci
            - run: npm run lint
            - run: npm run stylelint
            - run: npm test -- --watch=false --browsers=ChromeHeadless
            - run: npm run build
